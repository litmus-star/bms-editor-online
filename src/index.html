<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title data-i18n="app.name"></title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="app">
  <header id="tb">
    <div class="g">
      <button id="bOpen" data-i18n="tb.open" data-i18n-title="tb.open.tip"></button>
      <select id="fileSel" data-i18n-title="tb.fileSel.tip" disabled><option data-i18n="file.noFolder"></option></select>
      <button id="bNew" data-i18n="tb.new" data-i18n-title="tb.new.tip"></button>
      <button id="bSave" class="pri" data-i18n="tb.save" data-i18n-title="tb.save.tip"></button>
      <button id="bSaveAs" data-i18n="tb.saveAs" data-i18n-title="tb.saveAs.tip"></button>
    </div>
    <div class="g">
      <button id="bUndo" class="ic" data-i18n-title="tb.undo.tip">↶</button>
      <button id="bRedo" class="ic" data-i18n-title="tb.redo.tip">↷</button>
    </div>
    <div class="g">
      <button id="bDP" data-i18n-title="tb.playMode.tip">SP</button>
    </div>
    <div class="g seg">
      <button id="mSel" data-i18n-title="tb.modeSelect.tip"><span data-i18n="tb.modeSelect"></span> <kbd>F1</kbd></button>
      <button id="mWrite" data-i18n-title="tb.modeWrite.tip"><span data-i18n="tb.modeWrite"></span> <kbd>F3</kbd></button>
    </div>
    <div class="g">
      <select id="kindSel" data-i18n-title="tb.kind.tip"><option value="n" data-i18n="kind.long.n"></option><option value="h" data-i18n="kind.long.h"></option><option value="m" data-i18n="kind.long.m"></option></select>
      <input id="mineVal" type="text" value="01" maxlength="2" data-i18n-title="tb.mineVal.tip" style="width:38px" hidden>
    </div>
    <div class="g">
      <button id="pStart" data-i18n-title="tb.playStart.tip">⏮ <span data-i18n="tb.playStart"></span></button>
      <button id="pHere" data-i18n-title="tb.playHere.tip">▶ <span data-i18n="tb.playHere"></span></button>
      <button id="pStop" data-i18n-title="tb.stop.tip">■ <span data-i18n="tb.stop"></span></button>
    </div>
    <div class="g">
      <label><span data-i18n="tb.grid"></span> <select id="gridSel"></select></label>
      <label class="chk" title="G"><input type="checkbox" id="snapChk"> <span data-i18n="tb.snap"></span></label>
      <label class="chk" data-i18n-title="tb.lockH.tip"><input type="checkbox" id="lockChk"> <span data-i18n="tb.lockH"></span></label>
    </div>
    <div class="g"><label data-i18n-title="tb.zoomY.tip"><span data-i18n="tb.zoomY"></span> <input type="range" id="zoomR" min="0.25" max="8" step="0.25"></label><label data-i18n-title="tb.zoomX.tip"><span data-i18n="tb.zoomX"></span> <input type="range" id="zoomXR" min="0.4" max="4" step="0.05"></label></div>
    <div class="g"><label><span data-i18n="tb.volume"></span> <input type="range" id="volR" min="0" max="1" step="0.05"></label></div>
    <div class="g end">
      <span class="lock" data-i18n-title="tb.localOnly.tip">● <span data-i18n="tb.localOnly"></span></span>
      <button id="bHelp" data-i18n-title="tb.help.tip">?</button>
    </div>
  </header>
  <main>
    <section id="ed">
      <canvas id="cv"></canvas>
      <div id="sc" tabindex="0"><div id="sp"></div></div>
      <div id="empty">
        <h2 data-i18n="app.name"></h2>
        <p data-i18n-html="empty.intro"></p>
        <div class="row"><button id="eOpen" class="pri" data-i18n="tb.open"></button><button id="eNew" data-i18n="tb.new"></button></div>
        <p class="dim" data-i18n="empty.privacy"></p>
        <p class="dim" id="eNote"></p>
      </div>
      <div id="ctxMenu" hidden></div>
      <div id="drop" hidden data-i18n="drop.hint"></div>
    </section>
    <div id="split" data-i18n-title="side.split.tip"><button id="sideTgl" data-i18n-title="side.toggle.tip">▶</button></div>
    <aside id="side">
      <details id="pnHdr" open><summary data-i18n="pn.hdr"></summary><div class="bd" id="hdrBd"></div></details>
      <details id="pnWav" open><summary>WAV <span id="wavCnt" class="dim"></span></summary><div class="bd">
        <div class="row"><input id="wavQ" type="search" data-i18n-placeholder="pn.search.ph" spellcheck="false"><label class="chk"><input type="checkbox" id="wavDef"> <span data-i18n="pn.definedOnly"></span></label></div>
        <div id="wavList" class="list"></div>
        <div class="hint" data-i18n="pn.wav.hint"></div>
      </div></details>
      <details id="pnBmp"><summary>BMP (BGA) <span id="bmpCnt" class="dim"></span></summary><div class="bd">
        <div class="row"><input id="bmpQ" type="search" data-i18n-placeholder="pn.search.ph" spellcheck="false"><label class="chk"><input type="checkbox" id="bmpDef" checked> <span data-i18n="pn.definedOnly"></span></label></div>
        <div id="bmpList" class="list"></div>
        <div class="hint" data-i18n="pn.bmp.hint"></div>
      </div></details>
      <details id="pnBeat"><summary data-i18n="pn.beat"></summary><div class="bd">
        <div class="row"><input id="bN" type="number" min="1" max="999" value="3"><span>/</span><input id="bD" type="number" min="1" max="64" value="4"><button id="bApply" data-i18n="pn.beat.apply"></button><button id="bReset" data-i18n-title="pn.beat.reset.tip">4/4</button></div>
        <div id="beatList" class="list"></div>
        <div class="hint" data-i18n="pn.beat.hint"></div>
      </div></details>
      <details id="pnExp"><summary><span data-i18n="pn.exp"></span> <span id="expCnt" class="dim"></span></summary><div class="bd">
        <div id="blkTabs" class="tabs"></div>
        <textarea id="blkTx" spellcheck="false" data-i18n-placeholder="pn.exp.ph"></textarea>
        <div class="row"><button id="blkApply" data-i18n="pn.exp.apply"></button><button id="blkNew" data-i18n="pn.exp.new"></button><button id="blkDel" data-i18n="pn.exp.clear"></button></div>
        <div class="hint" data-i18n="pn.exp.hint"></div>
      </div></details>
      <details id="pnView"><summary data-i18n="pn.view"></summary><div class="bd col">
        <label class="chk"><input type="checkbox" id="oName"> <span data-i18n="pn.view.name"></span></label>
        <label class="chk" data-i18n-title="pn.view.scRight.tip"><input type="checkbox" id="oScRight"> <span data-i18n="pn.view.scRight"></span></label>
        <label class="chk" data-i18n-title="pn.view.bga.tip"><input type="checkbox" id="oHideBga"> <span data-i18n="pn.view.bga"></span></label>
        <label class="chk" data-i18n-title="pn.view.bpm.tip"><input type="checkbox" id="oHideBpm"> <span data-i18n="pn.view.bpm"></span></label>
        <label class="chk"><input type="checkbox" id="oFollow"> <span data-i18n="pn.view.follow"></span></label>
        <label class="chk"><input type="checkbox" id="oBgm"> <span data-i18n="pn.view.bgm"></span></label>
        <label class="chk"><input type="checkbox" id="oKeys"> <span data-i18n="pn.view.keys"></span></label>
        <label class="chk"><input type="checkbox" id="oBackup"> <span data-i18n="pn.view.backup"></span></label>
        <label class="chk"><input type="checkbox" id="oConfirm"> <span data-i18n="pn.view.confirm"></span></label>
        <label data-i18n-title="pn.view.openMode.tip"><span data-i18n="pn.view.openMode"></span> <select id="oOpenMode"><option value="auto" data-i18n="pn.view.openMode.auto"></option><option value="direct" data-i18n="pn.view.openMode.direct"></option><option value="pick" data-i18n="pn.view.openMode.pick"></option></select></label>
      </div></details>
      <details id="pnInfo" open><summary data-i18n="pn.info"></summary><div class="bd" id="infoBd"></div></details>
      <details id="pnDiag"><summary data-i18n="pn.diag"></summary><div class="bd">
        <pre id="diagBd"></pre>
        <div class="row"><button id="diagRun" data-i18n="pn.diag.run"></button><button id="diagCopy" data-i18n="pn.diag.copy"></button></div>
        <div class="hint" data-i18n="pn.diag.hint"></div>
      </div></details>
    </aside>
  </main>
  <footer id="stb">
    <span id="sPos"></span><span id="sNote"></span><span class="fill"></span>
    <span id="sLoad"></span>
    <label data-i18n-title="stb.enc.tip"><span data-i18n="stb.enc"></span> <select id="encSel"></select></label>
    <span id="sFile"></span>
  </footer>
</div>
<datalist id="audioList"></datalist>
<datalist id="imgList"></datalist>
<input type="file" id="dirIn" webkitdirectory multiple hidden>
<input type="file" id="filesIn" multiple hidden>
<div id="modal" hidden><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div><div class="btns" id="mBtns"></div></div></div>
<div id="toast"></div>
<script>/*__CORE__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
